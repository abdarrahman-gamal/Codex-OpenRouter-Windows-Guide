
# ============================================================
# 1. DEFAULT MODEL
# ============================================================

# The exact model ID from OpenRouter.
model = "nvidia/nemotron-3.5-lightning:free"

# Select the custom provider.
model_provider = "openrouter"

# Default reasoning effort.
model_reasoning_effort = "none"

# Load a custom model catalog for Codex.
model_catalog_json = 'C:\Users\user\.codex\openrouter-models.json'


# ============================================================
# 2. GENERAL DESKTOP SETTINGS
# ============================================================

notify = [
    "C:\\Program Files\\WindowsApps\\OpenAI.Codex_26.1117.4957.0_x64__2p2nqsd0c76g0\\app\\resources\\cua_node\\bin\\node_modules\\@oai\\sky\\bin\\windows\\codex-computer-use.exe",
    "turn-ended"
]


# ============================================================
# 3. OPENROUTER PROVIDER
# ============================================================

[model_providers.openrouter]

name = "OpenRouter Free Router"
base_url = "https://openrouter.ai/api/v1"
wire_api = "responses"

# Replace with a newly generated API key.
experimental_bearer_token = "key"

# No OpenAI OAuth required for this provider.
requires_openai_auth = false

[marketplaces.openai-primary-runtime]
source_type = "local"
source = '\\?\C:\Users\user\.cache\codex-runtimes\codex-primary-runtime\plugins\openai-primary-runtime'

[marketplaces.openai-bundled]
source_type = "local"
source = '\\?\C:\Users\user\.codex\.tmp\bundled-marketplaces\openai-bundled'


# ============================================================
# 4. EXISTING PLUGINS
# ============================================================

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

